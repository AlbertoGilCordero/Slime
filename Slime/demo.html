/* ══════════════════════════════════════════════════════════════
   BEING RECOGNISED
   If Slime already knows you, it should not ask who you are. Seeing a
   familiar face loads that person's profile, puts on their companion and
   greets them by name — the onboarding is skipped entirely, because the
   report already answers everything it would have asked.
   ══════════════════════════════════════════════════════════════ */
const greeted = {};
let currentPerson = null;      // whose passport the panel is showing
let missingFor = null;         // recognised, but nothing on file

function onRecognised(who){
  if(!who || !who.name) return;

  const p = window.SlimePeople ? SlimePeople.get(who.name) : null;
  const hasProfile = !!(p && p.role === "supported" && p.report);

  /* Loading the profile and saying hello are separate jobs. They used to share
     one guard, so if someone was seen BEFORE their profile was saved, they were
     marked as greeted and the profile never loaded again — no matter how many
     times the camera saw them afterwards. */
  const alreadyLoaded = (currentPerson === who.name);
  const firstTime = !greeted[who.name];

  if(!hasProfile){
    if(currentPerson === who.name){ currentPerson = null; }
    missingFor = who.name;
    paintProfile();
    if(firstTime){
      greeted[who.name] = true;
      const hi = "Hello " + who.name + ". How are you doing today?";
      addTurn({ say:hi, steps:[], mode:"text", check:null, tint:theme.palette.tint });
      say(hi);
      console.log("[slime] " + who.name + " recognised, but no support profile.",
        "known:", p ? "yes (role " + p.role + ")" : "no",
        "| on this device:", window.SlimePeople ? SlimePeople.all().join(", ") : "none");
    }
    return;
  }

  missingFor = null;
  waitedForFace = true;          // somebody is here; do not fall back
  if(alreadyLoaded) return;                  // nothing changed, leave them be

  currentPerson = who.name;
  const view = SlimePeople.view(who.name) || {};
  const w = view.who || {};

  profile = Object.assign({}, EMPTY_PROFILE, SlimePeople.flat(who.name), {
    film: w.specialInterest || null,
    character: w.preferredName || who.name,
  });
  phase = "chat";
  $("#question").textContent = "";

  /* SPECIAL INTEREST IS THE COMPANION.
     The document already says what this person loves, so the film question —
     which only ever existed to find that out — is skipped. */
  const interest = [w.specialInterest, w.likes].filter(Boolean).join(" ");
  const explicit = view.companion || SlimePeople.character(who.name);
  const named = explicit && CHARACTER_PAGES.find((c) => c.name === explicit);
  const pick = named || pickCharacter({ character:w.specialInterest, film:w.specialInterest }, interest);
  charPage = pick ? { file:pick.file, name:pick.name } : null;
  setCharacterPage(pick ? pick.file : null, pick ? pick.name : "neutral");

  paintProfile(); save();
  warmCalmAudio();

  console.log("[slime] loaded " + who.name
    + " — source " + (view._source || "?")
    + ", format " + profile.channel
    + ", interest '" + (w.specialInterest || "none") + "'"
    + ", companion " + (pick ? pick.name : "the gel"));

  /* greet once, but only now that we actually know who they are */
  if(firstTime){
    greeted[who.name] = true;
    const hi = "Hello " + (w.preferredName || who.name) + ". How are you doing today?";
    addTurn({ say:hi, steps:[], mode:"text", check:null, tint:theme.palette.tint });
    say(hi);
  }

  if(live() && w.specialInterest){
    callN8N({ action:"theme", system:THEME_PROMPT, user:"The thing they love: " + w.specialInterest })
      .then((t) => {
        theme = Object.assign({}, theme, t, { palette: Object.assign({}, theme.palette, t.palette || {}) });
        applyTheme();
        if(charPage) setCharacterPage(charPage.file, charPage.name);
      })
      .catch(() => {});
  }
}

/* ── swapping Slime's face. Used by the film question, and by the director if enabled ── */
/* The character pages anchor their artwork near the top of their own viewport
   rather than centring it, and each one sits at a different height. Since every
   file is served from the same origin we can simply MEASURE where the figure
   landed and slide the iframe so it lands in the middle. Read-only: we never
   touch the character's own layout, which is what broke it before. */
function centreCharacter(){
  const f = $("#charFrame");
  if(!f || !f.style) return;
  let doc;
  try{ doc = f.contentDocument; }catch(e){ return; }      // cross-origin: leave as is
  if(!doc || !doc.body) return;

  const roots = Array.prototype.slice.call(doc.querySelectorAll("svg"))
    .filter((s) => !s.parentElement || !s.parentElement.closest("svg"));
  let top = Infinity, bottom = -Infinity;
  roots.forEach((s) => {
    const r = s.getBoundingClientRect();
    if(r.height > 40){ top = Math.min(top, r.top); bottom = Math.max(bottom, r.bottom); }
  });
  if(!isFinite(top) || bottom <= top) return;

  const delta = (f.clientHeight / 2) - ((top + bottom) / 2);
  f.style.transform = "translateY(" + Math.round(delta) + "px)";
}

function setCharacterPage(file, name){
  const f = $("#charFrame"), gl = $("#gl");
  if(file){
    if(f.getAttribute("src") !== file){
      f.style.transform = "";
      f.src = file;
      /* the figure needs a moment to draw before it can be measured */
      f.onload = () => { [120, 400, 900, 1800].forEach((d) => setTimeout(centreCharacter, d)); };
    } else {
      setTimeout(centreCharacter, 60);
    }
    gl.classList.add("has-char");
    if(window.Slime3D) Slime3D.set({ hidden:true });   // the gel steps aside entirely
    SlimeLipsync.detachAll(); SlimeLipsync.attach(f);
    /* a missing character page must never kill the demo */
    f.onerror = () => {
      gl.classList.remove("has-char");
      if(window.Slime3D) Slime3D.set({ hidden:false });
      SlimeLipsync.detachAll(); SlimeLipsync.attach(window.SlimeCharacter);
      note("Character page " + file + " did not load. Using Slime's own face.");
    };
  } else {
    gl.classList.remove("has-char");
    f.style.transform = "";
    f.removeAttribute("src");
    if(window.Slime3D) Slime3D.set({ hidden:false });
    SlimeLipsync.detachAll(); SlimeLipsync.attach(window.SlimeCharacter);
  }
  if(window.SlimeVoices) SlimeVoices.setCharacter(name || "neutral");
  $("#who").textContent = (name && name !== "neutral")
    ? name.toUpperCase()
    : (theme.film ? theme.character + " · " + theme.film : "Slime");
  if(window.__slimeResize) window.__slimeResize();
}


/* ── the scene director drives these; every one of them is a real component ── */
if(window.SlimeScenes) SlimeScenes.init({
  say: (t) => { addTurn({ say:t, steps:[], mode:"text", check:null, tint:theme.palette.tint }); say(t); },

      '<div class="sh-b"><p class="sh-sum"></p></div>' +
      '<div class="sh-secs"></div>' +
      '<div class="sh-f"></div>';

    box.querySelector("strong").textContent = (d.name || subject) + " — support profile";
    box.querySelector(".sh-h span").textContent = d.reference || "";
    const meta = box.querySelector(".sh-meta");
    [["Report date", d.reportDate], ["Author", d.author], ["Setting", d.setting]]
      .forEach(([k, v]) => {
        const r = document.createElement("div"); r.className = "sh-r";
        r.innerHTML = "<span></span><b></b>";
        r.querySelector("span").textContent = k;
        r.querySelector("b").textContent = v || "—";
        meta.appendChild(r);
      });
    box.querySelector(".sh-sum").textContent = d.summary || "";

    const secs = box.querySelector(".sh-secs");
    const c = d.communication || {}, s = d.sensory || {}, l = d.learning || {}, g = d.regulation || {};
    const blocks = [
      ["Communication", [
        "Preferred format: " + (c.preferredFormat || "—") + ", then " + (c.secondFormat || "—"),
        "Detail: " + (c.detail || "—") + " · Pace: " + (c.pace || "—"),
      ].concat(c.notes || [])],
      ["Sensory", ["Stimulus tolerance: " + (s.stimulus || "—")].concat(s.notes || [])],
      ["What works", l.worksWell || []],
      ["What does not work", l.doesNotWork || []],
      ["Interests", d.interests || []],
      ["Early signs", g.earlySigns || []],
      ["What helps", g.helps || []],
      ["What to avoid", g.avoid || []],
      ["Contacts", (d.contacts || []).map((x) => x.name + " — " + x.relation + " (" + x.role + ")")],
    ];
    blocks.forEach(([title, items]) => {
      if(!items || !items.length) return;
      const wrap = document.createElement("div"); wrap.className = "sh-s";
      const hd = document.createElement("h4"); hd.textContent = title; wrap.appendChild(hd);
      const ul = document.createElement("ul");
      items.forEach((x) => { const li = document.createElement("li"); li.textContent = x; ul.appendChild(li); });
      wrap.appendChild(ul); secs.appendChild(wrap);
    });

    box.querySelector(".sh-f").textContent =
      "Released to Dr " + doctor + " · fictional demo record · Ctrl+P to save as PDF";
    out.appendChild(box); scroll();
  },
});

/* the camera feeds the director */
window.__sceneOnPerson = (who) => {
  if(who && who.name) lastFaceAt = Date.now();
  /* Profiles are written in vision.html, in another tab, after this page loaded
     its copy. Re-read before greeting, or a profile saved five minutes ago is
     invisible until someone reloads — which is exactly what went wrong. */
  if(who && who.name && window.SlimePeople && currentPerson !== who.name){
    SlimePeople.load().then(() => {
      onRecognised(who);
      if(window.SlimeScenes) SlimeScenes.personSeen(who);
    });
    return;
  }
  onRecognised(who);
  if(window.SlimeScenes) SlimeScenes.personSeen(who);
};
/* If there is no camera, or nobody is recognised within a few seconds, stop
   waiting and be the ordinary companion: ask the film question like always.
   A screen that sits there saying nothing because it hoped to know you is
   worse than one that simply asks. */
const RECOGNISE_WINDOW = 5000;

/* ══════════════════════════════════════════════════════════════
   GOING BACK TO BEING NOBODY'S COMPANION
   Slime holds someone's profile while they are there. Once the camera
   has not seen them for a minute — or is switched off — it lets go and
   becomes the plain companion again, asking the film question.

   Holding a profile open on an empty room is the wrong default: the next
   person to sit down would be spoken to as someone else, with someone
   else's format and someone else's document on screen.
   ══════════════════════════════════════════════════════════════ */
const IDLE_RESET = 60000;
let lastFaceAt = Date.now();

function resetToBase(why){
  console.log("[slime] back to base —", why);
  currentPerson = null; missingFor = null;
  charPage = null;
  Object.keys(greeted).forEach((k) => delete greeted[k]);
  profile = JSON.parse(JSON.stringify(EMPTY_PROFILE));
  theme = JSON.parse(JSON.stringify(DEFAULT_THEME));
  phase = "film";
  applyTheme();
  setCharacterPage(null, "neutral");
  paintProfile();
  save();
  $("#question").textContent = FILM_Q;
  say(FILM_Q);
}

setInterval(() => {
  /* never interrupt a crisis: someone stepping out of frame mid-episode
     must not take the calming screen with them */
  if($("#emergency") && $("#emergency").classList.contains("on")) return;
  if(!currentPerson) return;
  if(camOn && Date.now() - lastFaceAt < IDLE_RESET) return;
  resetToBase(camOn ? "nobody seen for a minute" : "camera switched off");
}, 5000);
let waitedForFace = false;
function fallBackToBase(){
  if(waitedForFace) return;
  waitedForFace = true;
  if(currentPerson) return;                 // somebody turned up after all
  if(phase !== "film" && phase !== "idle") return;
  charPage = null;
  setCharacterPage(null, "neutral");
  $("#question").textContent = FILM_Q;
  say(FILM_Q);
  console.log("[slime] nobody recognised in " + (RECOGNISE_WINDOW / 1000) + "s — asking the film question");
}

setMode();
if(restore()){
  applyTheme(); paintProfile();
  /* Once a character is chosen it IS the companion. Reloading the page must not
     quietly drop it back to the gel — the person came back to the same Slime. */
  if(!charPage){
    const guess = pickCharacter(theme, (theme.film || "") + " " + (theme.character || ""));
    if(guess) charPage = { file:guess.file, name:guess.name };
  }
  if(charPage) setCharacterPage(charPage.file, charPage.name);
  else setCharacterPage(null, "neutral");
  $("#question").textContent = phase === "format" ? FORMAT_Q : "";
} else {
  applyTheme(); paintProfile();
  $("#question").textContent = "";
  /* give the camera a moment to say who this is before falling back to asking */
  setTimeout(fallBackToBase, RECOGNISE_WINDOW);
  /* browsers block audio until the first gesture — speak on the first interaction */
  const kick = () => {
    if(!currentPerson && waitedForFace) say(FILM_Q);
    ["click","keydown","touchstart"].forEach((e) => removeEventListener(e,kick));
  };
  ["click","keydown","touchstart"].forEach((e) => addEventListener(e,kick));
}
